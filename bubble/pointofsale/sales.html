<script>
// =========================
// DROPDOWN
// =========================
function myFunction() {
    document.getElementById("myDropdown").classList.toggle("show");
}

window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");

        for (var i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];

            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
};

// =========================
// DISPLAY SALES
// =========================

function displaySales(data) {

    const result = document.getElementById("searchresult");

    if (data.length === 0) {
        result.innerHTML = `
            <table>
                <tr>
                    <td colspan="5" style="text-align:center;">
                        No sale records found.
                    </td>
                </tr>
            </table>
        `;
        return;
    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Date of Sale</th>
                    <th>Total Sale</th>
                    <th>Account who Ended Sale</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                </tr>
            </thead>

            <tbody>
    `;

    data.forEach(sale => {

        html += `
            <tr>
                <td>${sale.date}</td>
                <td>${sale.total}</td>
                <td>${sale.account}</td>
                <td>${sale.firstName}</td>
                <td>${sale.lastName}</td>
            </tr>
        `;

    });

    html += `
            </tbody>
        </table>
    `;

    result.innerHTML = html;
}


// =========================
// LIVE SEARCH
// =========================

document.addEventListener("DOMContentLoaded", function() {

    const search = document.getElementById("live_search");

    // Show all records when page loads
    displaySales(sales);

    search.addEventListener("keyup", function() {

        const input = this.value.toLowerCase().trim();

        if (input === "") {
            displaySales(sales);
            return;
        }

        const filteredSales = sales.filter(sale =>
            sale.date.toLowerCase().includes(input) ||
            sale.total.toLowerCase().includes(input) ||
            sale.account.toLowerCase().includes(input) ||
            sale.firstName.toLowerCase().includes(input) ||
            sale.lastName.toLowerCase().includes(input)
        );

        displaySales(filteredSales);

    });

});

// =========================
// LIVE SEARCH
// =========================
document.addEventListener("DOMContentLoaded", function() {

    const search = document.getElementById("live_search");

    // Display all records when page loads
    displaySales(sales);

    search.addEventListener("keyup", function() {

        const input = this.value.toLowerCase().trim();

        if (input === "") {
            displaySales(sales);
            return;
        }

        const filteredSales = sales.filter(sale =>
            sale.id.toLowerCase().includes(input) ||
            sale.date.toLowerCase().includes(input) ||
            sale.time.toLowerCase().includes(input) ||
            sale.order.toLowerCase().includes(input) ||
            sale.type.toLowerCase().includes(input) ||
            sale.total.toLowerCase().includes(input)
        );

        displaySales(filteredSales);
    });

});
