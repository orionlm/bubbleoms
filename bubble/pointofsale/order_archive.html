</head>

/* =========================================================
   PAGINATION SETTINGS
========================================================= */

const limit = 20;

let currentPage = 1;

let filteredOrders = [...orders];


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDateTime(dateString) {

    const date = new Date(dateString);

    return date.toLocaleString(
        "en-US",
        {
            month: "short",
            day: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders() {

    const tbody =
        document.getElementById("ordersBody");

    const noOrders =
        document.getElementById("noOrders");

    const table =
        document.getElementById("ordersTable");

    tbody.innerHTML = "";

    document.getElementById("pagination")
        .innerHTML = "";


    /* NO RESULTS */

    if (filteredOrders.length === 0) {

        table.style.display = "none";

        noOrders.style.display = "block";

        return;

    }


    table.style.display = "table";

    noOrders.style.display = "none";


    /* TOTAL PAGES */

    const totalPages =
        Math.ceil(
            filteredOrders.length / limit
        );


    if (currentPage > totalPages) {

        currentPage = totalPages;

    }


    /* CURRENT PAGE */

    const start =
        (currentPage - 1) * limit;

    const end =
        start + limit;

    const pageOrders =
        filteredOrders.slice(
            start,
            end
        );


    /* CREATE ROWS */

    pageOrders.forEach(order => {

        const row =
            document.createElement("tr");


        /* ORDER ID */

        const orderId =
            document.createElement("td");

        orderId.innerHTML =
            `<strong>${order.order_id}</strong>`;


        /* DATE */

        const date =
            document.createElement("td");

        date.textContent =
            formatDateTime(
                order.created_at
            );


        /* TYPE */

        const type =
            document.createElement("td");

        const badge =
            document.createElement("span");


        badge.classList.add(
            "order-type-badge"
        );


        if (
            order.order_type ===
            "takeout"
        ) {

            badge.classList.add(
                "takeout"
            );

            badge.textContent =
                "Takeout";

        } else {

            badge.classList.add(
                "dine-in"
            );

            badge.textContent =
                "Dine In";

        }


        type.appendChild(badge);


        /* TOTAL */

        const total =
            document.createElement("td");

        total.textContent =
            "₱" +
            Number(order.total)
                .toLocaleString(
                    "en-PH",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );


        /* ACTION */

        const action =
            document.createElement("td");


        const viewButton =
            document.createElement("a");


        viewButton.href =
            "view_receipt_for_archive.html?order_id=" +
            encodeURIComponent(
                order.order_id
            );


        viewButton.className =
            "view-receipt-btn";


        viewButton.textContent =
            "View Receipt";


        action.appendChild(
            viewButton
        );


        /* APPEND */

        row.appendChild(orderId);

        row.appendChild(date);

        row.appendChild(type);

        row.appendChild(total);

        row.appendChild(action);


        tbody.appendChild(row);

    });


    renderPagination(totalPages);

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(totalPages) {

    const pagination =
        document.getElementById(
            "pagination"
        );


    if (totalPages <= 1) {

        return;

    }


    /* PREVIOUS */

    if (currentPage > 1) {

        const previous =
            document.createElement("a");

        previous.textContent =
            "← Previous";

        previous.href = "#";


        previous.onclick =
            function(event) {

                event.preventDefault();

                currentPage--;

                renderOrders();

            };


        pagination.appendChild(
            previous
        );

    }


    /* PAGE NUMBERS */

    const startPage =
        Math.max(
            1,
            currentPage - 2
        );


    const endPage =
        Math.min(
            totalPages,
            currentPage + 2
        );


    for (
        let i = startPage;
        i <= endPage;
        i++
    ) {

        const page =
            document.createElement(
                i === currentPage
                    ? "span"
                    : "a"
            );


        page.textContent = i;


        if (
            i === currentPage
        ) {

            page.className =
                "current";

        } else {

            page.href = "#";


            page.onclick =
                function(event) {

                    event.preventDefault();

                    currentPage = i;

                    renderOrders();

                };

        }


        pagination.appendChild(
            page
        );

    }


    /* NEXT */

    if (
        currentPage < totalPages
    ) {

        const next =
            document.createElement("a");


        next.textContent =
            "Next →";


        next.href = "#";


        next.onclick =
            function(event) {

                event.preventDefault();

                currentPage++;

                renderOrders();

            };


        pagination.appendChild(
            next
        );

    }

}


/* =========================================================
   SEARCH AND FILTER
========================================================= */

document
    .getElementById("searchForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            applyFilters();

        }
    );


function applyFilters() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const date =
        document
            .getElementById(
                "dateInput"
            )
            .value;


    const orderType =
        document
            .getElementById(
                "orderTypeInput"
            )
            .value;


    filteredOrders =
        orders.filter(order => {

            /* SEARCH */

            const matchesSearch =
                search === "" ||
                order.order_id
                    .toLowerCase()
                    .includes(search);


            /* DATE */

            const orderDate =
                order.created_at
                    .split("T")[0];


            const matchesDate =
                date === "" ||
                orderDate === date;


            /* TYPE */

            const matchesType =
                orderType === "" ||
                order.order_type ===
                    orderType;


            return (
                matchesSearch &&
                matchesDate &&
                matchesType
            );

        });


    currentPage = 1;

    renderOrders();

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

function clearFilters() {

    document
        .getElementById(
            "searchInput"

    document

            "dateInput"
        )
        .value = "";


    document
        .getElementById(
            "orderTypeInput"
        )
        .value = "";


    filteredOrders =
        [...orders];


    currentPage = 1;

    renderOrders();

}


/* =========================================================
   INITIALIZE PAGE
========================================================= */

window.onload = function() {

    renderOrders();

};

</script>

</body>
</html>
