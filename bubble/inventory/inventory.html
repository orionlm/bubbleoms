<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../media/BUBBLE.jpg">
    <link rel="stylesheet" href="../interface/homepage.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Inventory Summary</title>

    <link rel="stylesheet" href="../fonts/fonts.css">

    <style>
        .navbar {
            background-color: #7e5832;
            width: 100%;
            height: 80px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            box-shadow: 0px 5px 11px 1px rgba(0, 0, 0, 0.28);
            display: flex;
            justify-content: left;
        }

        .navbar-right {
            width: 50%;
            height: 80px;
            position: absolute;
            top: 0;
            right: 0;
            z-index: 11;
            display: flex;
            justify-content: right;
        }

        .buttons {
            position: relative;
            width: 330px;
            left: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            font-family: Poppins;
            font-weight: bold;
            color: #f0f0f0;
            box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);
            height: 40px;
            width: 150px;
            background-color: #337609;
            border: none;
            border-radius: 25px;
            transition: 0.5s;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #326810;
            transition: 0.5s;
        }

        /* Dropdown Styling */

        .dropbtn {
            background-color: transparent;
            color: #f0f0f0;
            padding: 16px;
            font-size: 16px;
            min-width: 110px;
            border: none;
            cursor: pointer;
            font-family: Poppins;
            font-weight: bolder;
        }

        .dropbtn:hover {
            background-color: #5a4026;
        }

        .dropdown {
            position: relative;
            width: 490px;
            display: flex;
            justify-content: right;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f1f1f1;
            min-width: 110px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            top: 80px;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .show {
            display: block;
        }

        /* Main Container */

        .main {
            position: relative;
            width: 100%;
            height: auto;
            display: flex;
            justify-content: space-evenly;
        }

        .scroll {
            position: relative;
            top: 60px;
            overflow: scroll;
            overflow-x: hidden;
            width: 100%;
            height: 90vh;
        }

        h1 {
            margin: 5px;
        }

        select {
            padding: 8px;
            font-family: Poppins;
            margin-top: 5px;
        }

        .container,
        .container1,
        .chart-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

    <!-- ============================= -->
    <!-- NAVBAR -->
    <!-- ============================= -->

    <div class="navbar">

        <div style="
            position: relative;
            width: 20px;
            left: 30px;
            display: flex;
            align-items: center;
        "></div>

        <div class="buttons">

            <button
                type="button"
                class="btn"
                onclick="goBack()">

                Back

            </button>

        </div>

    </div>


    <!-- ============================= -->
    <!-- RIGHT NAVBAR -->
    <!-- ============================= -->

    <div class="navbar-right">

        <div class="dropdown">

            <button
                onclick="toggleDropdown()"
                class="dropbtn">

                Admin

            </button>

            <div
                id="myDropdown"
                class="dropdown-content">

                <a
                    href="javascript:void(0)"
                    onclick="logout()">

                    Logout

                </a>

            </div>

        </div>

        <div style="
            position: relative;
            width: 20px;
            right: 30px;
            display: flex;
            align-items: center;
        "></div>

    </div>


    <!-- ============================= -->
    <!-- MAIN -->
    <!-- ============================= -->

    <div class="main">

        <div class="scroll">


            <!-- ============================= -->
            <!-- INVENTORY BAR CHART -->
            <!-- ============================= -->

            <div
                class="container"
                style="
                    width: 90%;
                    margin: auto;
                    padding-top: 50px;
                ">

                <h1>
                    Inventory Overview
                </h1>


                <label for="filter">
                    Filter by:
                </label>


                <select
                    id="filter"
                    onchange="applyFilter()">

                    <option value="all">
                        All
                    </option>

                    <option value="foods">
                        Foods
                    </option>

                    <option value="drinks">
                        Drinks
                    </option>

                </select>


                <canvas
                    id="inventoryChart"
                    width="1000"
                    height="600">
                </canvas>

            </div>



            <!-- ============================= -->
            <!-- SALES LINE GRAPH -->
            <!-- ============================= -->

            <div
                class="container1"
                style="
                    width: 80%;
                    margin: auto;
                    padding-top: 50px;
                ">

                <h1>
                    POS Sales Overview
                </h1>

                <canvas
                    id="pieChart"
                    width="400"
                    height="200"
                    style="margin-top: 20px;">
                </canvas>

            </div>



            <!-- ============================= -->
            <!-- ORDER ITEMS BAR CHART -->
            <!-- ============================= -->

            <div
                class="chart-container"
                style="
                    width: 40%;
                    margin: auto;
                    padding-top: 50px;
                ">

                <h1 style="text-align:center">
                    Order Items Overview
                </h1>

                <canvas
                    id="itemQuantityChart">
                </canvas>

            </div>


        </div>

    </div>



    <script>

        /*
        ============================================================
        SAMPLE INVENTORY DATA
        ============================================================

        You can change these values to whatever sample data
        you want to display.

        ITEM_NAME       = Name of inventory item
        CURRENT_QUANTITY = Current stock
        ============================================================
        */

        const allData = [

            {
                ITEM_NAME: "Chicken",
                CURRENT_QUANTITY: 50
            },

            {
                ITEM_NAME: "French Fries",
                CURRENT_QUANTITY: 35
            },

            {
                ITEM_NAME: "Burger Bun",
                CURRENT_QUANTITY: 40
            },

            {
                ITEM_NAME: "Milk",
                CURRENT_QUANTITY: 25
            },

            {
                ITEM_NAME: "Strawberry Syrup",
                CURRENT_QUANTITY: 18
            },

            {
                ITEM_NAME: "Watermelon Syrup",
                CURRENT_QUANTITY: 22
            },

            {
                ITEM_NAME: "Blueberry Syrup",
                CURRENT_QUANTITY: 15
            },

            {
                ITEM_NAME: "Lychee Syrup",
                CURRENT_QUANTITY: 20
            },

            {
                ITEM_NAME: "Mango Syrup",
                CURRENT_QUANTITY: 28
            },

            {
                ITEM_NAME: "Tea",
                CURRENT_QUANTITY: 30
            }

        ];


        /*
        ============================================================
        FOOD DATA
        ============================================================
        */

        const foods = [

            {
                ITEM_NAME: "Chicken",
                CURRENT_QUANTITY: 50
            },

            {
                ITEM_NAME: "French Fries",
                CURRENT_QUANTITY: 35
            },

            {
                ITEM_NAME: "Burger Bun",
                CURRENT_QUANTITY: 40
            }

        ];


        /*
        ============================================================
        DRINK DATA
        ============================================================
        */

        const drinks = [

            {
                ITEM_NAME: "Milk",
                CURRENT_QUANTITY: 25
            },

            {
                ITEM_NAME: "Strawberry Syrup",
                CURRENT_QUANTITY: 18
            },

            {
                ITEM_NAME: "Watermelon Syrup",
                CURRENT_QUANTITY: 22
            },

            {
                ITEM_NAME: "Blueberry Syrup",
                CURRENT_QUANTITY: 15
            },

            {
                ITEM_NAME: "Lychee Syrup",
                CURRENT_QUANTITY: 20
            },

            {
                ITEM_NAME: "Mango Syrup",
                CURRENT_QUANTITY: 28
            },

            {
                ITEM_NAME: "Tea",
                CURRENT_QUANTITY: 30
            }

        ];



        /*
        ============================================================
        SAMPLE SALES DATA
        ============================================================
        */

        const salesData = [

            {
                DATE_OF_SALE: "2026-08-01",
                TOTAL_SALE: 1500
            },

            {
                DATE_OF_SALE: "2026-08-02",
                TOTAL_SALE: 1800
            },

            {
                DATE_OF_SALE: "2026-08-03",
                TOTAL_SALE: 1650
            },

            {
                DATE_OF_SALE: "2026-08-04",
                TOTAL_SALE: 2100
            },

            {
                DATE_OF_SALE: "2026-08-05",
                TOTAL_SALE: 1900
            },

            {
                DATE_OF_SALE: "2026-08-06",
                TOTAL_SALE: 2300
            },

            {
                DATE_OF_SALE: "2026-08-07",
                TOTAL_SALE: 2500
            },

            {
                DATE_OF_SALE: "2026-08-08",
                TOTAL_SALE: 2200
            },

            {
                DATE_OF_SALE: "2026-08-09",
                TOTAL_SALE: 2400
            },

            {
                DATE_OF_SALE: "2026-08-10",
                TOTAL_SALE: 2600
            },

            {
                DATE_OF_SALE: "2026-08-11",
                TOTAL_SALE: 2450
            },

            {
                DATE_OF_SALE: "2026-08-12",
                TOTAL_SALE: 2800
            },

            {
                DATE_OF_SALE: "2026-08-13",
                TOTAL_SALE: 2700
            },

            {
                DATE_OF_SALE: "2026-08-14",
                TOTAL_SALE: 3000
            },

            {
                DATE_OF_SALE: "2026-08-15",
                TOTAL_SALE: 2900
            },

            {
                DATE_OF_SALE: "2026-08-16",
                TOTAL_SALE: 3100
            },

            {
                DATE_OF_SALE: "2026-08-17",
                TOTAL_SALE: 3300
            },

            {
                DATE_OF_SALE: "2026-08-18",
                TOTAL_SALE: 3200
            },

            {
                DATE_OF_SALE: "2026-08-19",
                TOTAL_SALE: 3500
            },

            {
                DATE_OF_SALE: "2026-08-20",
                TOTAL_SALE: 3700
            }

        ];



        /*
        ============================================================
        SAMPLE ORDER ITEM QUANTITIES
        ============================================================
        */

        const itemData = {

            "Classic Burger": 35,

            "Cheese Burger": 28,

            "French Fries": 45,

            "Milk Tea": 52,

            "Strawberry Milk": 31,

            "Mango Tea": 40

        };



        /*
        ============================================================
        CHART VARIABLES
        ============================================================
        */

        let inventoryChart;

        let pieChart;



        /*
        ============================================================
        ORDER ITEM QUANTITY CHART
        ============================================================
        */

        const itemLabels =
            Object.keys(itemData);

        const itemQuantities =
            Object.values(itemData);


        const itemCtx =
            document
                .getElementById(
                    'itemQuantityChart'
                )
                .getContext('2d');


        const itemQuantityChart =
            new Chart(
                itemCtx,
                {

                    type: 'bar',

                    data: {

                        labels: itemLabels,

                        datasets: [{

                            label:
                                'Order Item Quantities',

                            data:
                                itemQuantities,

                            backgroundColor: [

                                '#FF6384',
                                '#36A2EB',
                                '#FFCE56',
                                '#4BC0C0',
                                '#9966FF',
                                '#FF9F40'

                            ],

                            hoverOffset: 4

                        }]

                    },


                    options: {

                        responsive: true,

                        plugins: {

                            legend: {

                                position: 'top'

                            },

                            title: {

                                display: true,

                                text:
                                    'Order Items and Their Quantities'

                            }

                        }

                    }

                }
            );



        /*
        ============================================================
        INVENTORY BAR CHART
        ============================================================
        */

        function createBarChart(data) {

            const ctx =
                document
                    .getElementById(
                        'inventoryChart'
                    )
                    .getContext('2d');


            const labels =
                data.map(
                    item =>
                        item.ITEM_NAME
                );


            const quantities =
                data.map(
                    item =>
                        item.CURRENT_QUANTITY
                );


            if (inventoryChart)
                inventoryChart.destroy();


            inventoryChart =
                new Chart(
                    ctx,
                    {

                        type: 'bar',

                        data: {

                            labels: labels,

                            datasets: [{

                                label:
                                    'Inventory',

                                data:
                                    quantities,

                                backgroundColor: [

                                    'rgba(255, 99, 132, 0.2)',

                                    'rgba(54, 162, 235, 0.2)',

                                    'rgba(255, 206, 86, 0.2)',

                                    'rgba(75, 192, 192, 0.2)',

                                    'rgba(153, 102, 255, 0.2)',

                                    'rgba(20, 172, 123, 0.2)'

                                ],

                                borderColor: [

                                    'rgba(255, 99, 132, 1)',

                                    'rgba(54, 162, 235, 1)',

                                    'rgba(255, 206, 86, 1)',

                                    'rgba(75, 192, 192, 1)',

                                    'rgba(20, 172, 123, 1)',

                                    'rgba(153, 102, 255, 1)'

                                ],

                                borderWidth: 1

                            }]

                        },


                        options: {

                            indexAxis: 'y',

                            scales: {

                                x: {
                                    beginAtZero: true
                                },

                                y: {
                                    beginAtZero: true
                                }

                            }

                        }

                    }
                );
        }



        /*
        ============================================================
        SALES LINE GRAPH
        ============================================================
        */

        function createSalesDoughnutChart(data) {

            const ctx =
                document
                    .getElementById(
                        'pieChart'
                    )
                    .getContext('2d');


            const labels =
                data.map(
                    item =>
                        item.DATE_OF_SALE
                );


            const sales =
                data.map(
                    item =>
                        item.TOTAL_SALE
                );


            if (pieChart)
                pieChart.destroy();


            pieChart =
                new Chart(
                    ctx,
                    {

                        type: 'line',

                        data: {

                            labels: labels,

                            datasets: [{

                                label:
                                    'Sales Overview',

                                data: sales,

                                backgroundColor: [

                                    'rgba(255, 99, 132, 0.2)',

                                    'rgba(54, 162, 235, 0.2)',

                                    'rgba(255, 206, 86, 0.2)',

                                    'rgba(75, 192, 192, 0.2)',

                                    'rgba(153, 102, 255, 0.2)',

                                    'rgba(20, 172, 123, 0.2)'

                                ],

                                borderColor: [

                                    'rgba(255, 99, 132, 1)',

                                    'rgba(54, 162, 235, 1)',

                                    'rgba(255, 206, 86, 1)',

                                    'rgba(75, 192, 192, 1)',

                                    'rgba(20, 172, 123, 1)',

                                    'rgba(153, 102, 255, 1)'

                                ],

                                borderWidth: 1,

                                tension: 0.3

                            }]

                        },


                        options: {

                            responsive: true,

                            plugins: {

                                legend: {

                                    position: 'top'

                                }

                            },

                            scales: {

                                y: {

                                    beginAtZero: true

                                }

                            }

                        }

                    }
                );
        }



        /*
        ============================================================
        INVENTORY FILTER
        ============================================================
        */

        function applyFilter() {

            const filter =
                document
                    .getElementById("filter")
                    .value;


            let data =
                allData;


            if (
                filter === "foods"
            ) {

                data =
                    foods;

            } else if (
                filter === "drinks"
            ) {

                data =
                    drinks;
            }


            createBarChart(data);
        }



        /*
        ============================================================
        DROPDOWN
        ============================================================
        */

        function toggleDropdown() {

            document
                .getElementById(
                    "myDropdown"
                )
                .classList.toggle(
                    "show"
                );
        }



        /*
        ============================================================
        CLOSE DROPDOWN
        ============================================================
        */

        window.onclick =
            function (event) {

                if (
                    !event.target.matches(
                        '.dropbtn'
                    )
                ) {

                    const dropdowns =
                        document
                            .getElementsByClassName(
                                "dropdown-content"
                            );


                    for (
                        let i = 0;
                        i < dropdowns.length;
                        i++
                    ) {

                        const openDropdown =
                            dropdowns[i];


                        if (
                            openDropdown
                                .classList
                                .contains(
                                    'show'
                                )
                        ) {

                            openDropdown
                                .classList
                                .remove(
                                    'show'
                                );
                        }
                    }
                }
            };



        /*
        ============================================================
        BACK BUTTON
        ============================================================
        */

        function goBack() {

            window.location.href = "../interface/admin_homepage.html";

        }



        /*
        ============================================================
        LOGOUT
        ============================================================
        */

        function logout() {

            /*
             * Since PHP/session authentication was removed,
             * this only returns to the previous page.
             */

            window.history.back();

        }



        /*
        ============================================================
        INITIALIZE CHARTS
        ============================================================
        */

        createBarChart(allData);

        createSalesDoughnutChart(salesData);

    </script>

</body>

</html>
