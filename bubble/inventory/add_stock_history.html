<script>
    function myFunction() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    window.onclick = function (event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");

            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];

                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }

/* =========================================================
   RENDER STOCK HISTORY
   ========================================================= */

function renderStockHistory(data) {

    const tbody = document.getElementById("stockHistoryBody");

    tbody.innerHTML = "";

    data.forEach(function (record) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${record.id}</td>
            <td>${escapeHTML(record.productName)}</td>
            <td>${record.quantity}</td>
            <td>${record.totalPrice}</td>
            <td>${record.date}</td>
            <td>${record.time}</td>
        `;

        tbody.appendChild(row);

    });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   SEARCH FUNCTION
   ========================================================= */

document.getElementById("searchInput").addEventListener("keyup", function () {

    const searchValue = this.value.trim().toUpperCase();

    const rows = document
        .getElementById("stockHistoryBody")
        .getElementsByTagName("tr");


    for (let i = 0; i < rows.length; i++) {

        const cells = rows[i].getElementsByTagName("td");

        let found = false;


        for (let j = 0; j < cells.length; j++) {

            const originalText =
                cells[j].textContent || cells[j].innerText;

            const upperText =
                originalText.toUpperCase();


            /*
             * Empty search:
             * restore the original text
             */
            if (searchValue === "") {

                cells[j].textContent = originalText;

                continue;

            }


            const index =
                upperText.indexOf(searchValue);


            if (index > -1) {

                found = true;


                /*
                 * Highlight matching text
                 */
                const before =
                    originalText.substring(0, index);

                const match =
                    originalText.substring(
                        index,
                        index + searchValue.length
                    );

                const after =
                    originalText.substring(
                        index + searchValue.length
                    );


                cells[j].innerHTML =
                    escapeHTML(before) +
                    "<span class='highlight'>" +
                    escapeHTML(match) +
                    "</span>" +
                    escapeHTML(after);

            } else {

                /*
                 * Remove old highlighting
                 */
                cells[j].textContent = originalText;

            }

        }


        rows[i].style.display =
            found ? "" : "none";

    }

});
