<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../media/BUBBLE.jpg">
    <link rel="stylesheet" href="../fonts/fonts.css">

    <title>Add New Employee Account</title>

    <style>
        .navbar {
            background-color: #7e5832;
            width: 100%;
            height: 80px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
            display: flex;
            justify-content: left;
        }

        .buttons {
            position: relative;
            width: 370px;
            left: 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            font-family: Poppins;
            font-weight: bold;
            color: #f0f0f0;
            box-shadow: 3px 4px 11px 1px rgba(0,0,0,0.28);

            height: 40px;
            width: 150px;
            background-color: #337609;
            border: none;
            border-radius: 25px;
            transition: 0.5s;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #326810;
            transition: 0.5s;
        }

        .space {
            position: relative;
            width: 320px;
            left: 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Dropdown Button */

        .dropbtn {
            background-color: transparent;
            color: #f0f0f0;
            padding: 16px;
            min-width: 110px;
            font-size: 16px;
            border: none;
            cursor: pointer;

            font-family: Poppins;
            font-weight: bolder;
        }

        .dropbtn:hover {
            background-color: #5a4026;
        }

        .dropdown {
            position: relative;
            width: 490px;
            display: flex;
            justify-content: right;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f1f1f1;
            min-width: 110px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            top: 80px;

            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #ddd;

            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .show {
            display: block;
        }

        .list {
            position: relative;
            top: 100px;
        }

        .main {
            position: relative;
            margin: auto;
            width: 70%;
            display: flex;
            align-items: center;
        }

        .left {
            position: relative;
            height: auto;
            width: 50%;
            padding: 20px;
            align-self: flex-start;
        }

        .left-a,
        .right-a {
            position: relative;
        }

        .right {
            position: relative;
            height: auto;
            width: 50%;
            padding: 20px;
            align-self: flex-start;
        }

        .inputs {
            padding: 10px;
        }

        input {
            border-color: #337609 solid;
            border-radius: 10px;
            background-color: white;
            margin-bottom: 10px;
            color: #181818;
            height: 30px;
            width: 100%;
            text-indent: 10px;
            outline: none;
            box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
        }

        input:focus,
        select:focus {
            border-color: #337609;
        }

        .submit {
            display: flex;
            width: 70%;
            margin: auto;
            justify-content: center;
        }

        .space1 {
            width: 20%;
        }

        .btn1 {
            width: 200px;
            background-color: #2c2c2c;
            box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
            border: none;
            height: 30px;
            margin: 10px 50px;
            border-radius: 15px;
            color: #f0f0f0;
            font-family: Poppins;
            cursor: pointer;
        }

        .btn1:hover {
            background-color: #444;
        }

        .btn2 {
            position: relative;
            background-color: #2c2c2c;
            box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
            top: 13px;
            border: none;
            height: 30px;
            padding: 5px 75px;
            margin: 10px 50px;
            border-radius: 15px;
            color: #f0f0f0;
            font-family: Poppins;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn2:hover {
            background-color: #444;
        }

        .navbar-right {
            width: 50%;
            height: 80px;
            position: absolute;
            top: 0;
            right: 0;
            z-index: 11;
            display: flex;
            justify-content: right;
        }

        ::placeholder {
            color: #181818;
            font-family: Poppins;
            font-style: italic;
            opacity: 50%;
        }

        select {
            font-family: Poppins;
            border-color: #337609;
            border-radius: 10px;
            background-color: white;
            color: #181818;
            height: 30px;
            width: 101%;
            text-indent: 10px;
            outline: none;
            box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
            font-style: italic;
        }

        select option {
            background-color: #ddd;
            color: #181818;
            scrollbar-highlight-color: #326810;
        }

        /* Error / Success */

        .message {
            text-indent: 10px;
            color: #f0f0f0;
            padding: 5px;
            width: 30%;
            margin: 0 auto 10px auto;
            border-radius: 15px;
            text-align: center;
            display: none;
        }

        .error {
            background: #ff4545;
        }

        .success {
            background: #337609;
        }

        /* Responsive */

        @media (max-width: 900px) {

            .main {
                width: 90%;
            }

            .submit {
                width: 90%;
            }

        }

        @media (max-width: 650px) {

            .main {
                width: 100%;
                flex-direction: column;
            }

            .left,
            .right {
                width: 90%;
            }

            .navbar {
                height: 70px;
            }

            .navbar-right {
                height: 70px;
            }

            .logo img {
                width: 65px;
            }

            .buttons {
                width: auto;
            }

            .btn {
                width: 100px;
            }

            .dropdown {
                width: auto;
            }

            .submit {
                width: 100%;
                flex-direction: column;
                align-items: center;
            }

            .space1 {
                display: none;
            }

            .btn1 {
                margin: 10px;
            }

            .btn2 {
                margin: 10px;
            }

            .message {
                width: 80%;
            }

        }
    </style>
</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <div class="navbar">

        <div style="
            position: relative;
            width: 20px;
            left: 30px;
            display: flex;
            align-items: center;
        "></div>

        <div class="logo">
            <img src="../media/BUBBLE.jpg" width="80px">
        </div>

        <div class="buttons">

            <button
                type="button"
                class="btn"
                onclick="goBack()">
                Back
            </button>

        </div>

    </div>


    <!-- =========================
         ADMIN DROPDOWN
    ========================== -->

    <div class="navbar-right">

        <div class="dropdown">

            <button
                onclick="myFunction()"
                class="dropbtn">
                Admin
            </button>

            <div
                id="myDropdown"
                class="dropdown-content">

                <a href="../interface/login.html">
                    Logout
                </a>

            </div>

        </div>

        <div style="
            position: relative;
            width: 20px;
            right: 30px;
            display: flex;
            align-items: center;
        "></div>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="list">

        <center>
            <h1 style="margin: 2px;">
                Add New Employee
            </h1>
        </center>


        <!-- ERROR MESSAGE -->

        <div
            id="errorMessage"
            class="message error">
        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="message success">
        </div>


        <div class="inputs">

            <form id="employeeForm">

                <div class="main">


                    <!-- =========================
                         LEFT SIDE
                    ========================== -->

                    <div class="left">

                        <div class="left-a">

                            <label>
                                First Name
                            </label>

                            <div style="margin-right: 5%;">

                                <input
                                    style="font-family: Poppins;"
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter First Name"
                                    autocomplete="off"
                                    name="fname"
                                    id="fname">

                            </div>


                            <label>
                                Email
                            </label>

                            <div style="margin-right: 5%;">

                                <input
                                    style="font-family: Poppins;"
                                    type="email"
                                    class="form-control"
                                    placeholder="lastname@bhemployee"
                                    autocomplete="off"
                                    name="email"
                                    id="email">

                            </div>


                            <label>
                                Contact Number
                            </label>

                            <div style="margin-right: 5%;">

                                <input
                                    style="font-family: Poppins;"
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter Employee's Phone Number"
                                    autocomplete="off"
                                    name="contact"
                                    id="contact">

                            </div>


                            <label>
                                Role
                            </label>

                            <div style="margin-right: 5%;">

                                <select
                                    name="role"
                                    id="role"
                                    class="drop-select">

                                    <option
                                        value=""
                                        disabled
                                        selected>
                                        Select Role
                                    </option>

                                    <option value="Admin">
                                        Admin
                                    </option>

                                    <option value="Employee">
                                        Employee
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- =========================
                         RIGHT SIDE
                    ========================== -->

                    <div class="right">

                        <div class="right-a">

                            <label>
                                Last Name
                            </label>

                            <div>

                                <input
                                    style="font-family: Poppins;"
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter Last Name"
                                    autocomplete="off"
                                    name="lname"
                                    id="lname">

                            </div>


                            <label>
                                Password
                            </label>

                            <div>

                                <input
                                    style="font-family: Poppins;"
                                    type="password"
                                    class="form-control"
                                    placeholder="Default: bubblehideout"
                                    autocomplete="off"
                                    name="password"
                                    id="password">

                            </div>


                            <label>
                                Confirm Password
                            </label>

                            <div>

                                <input
                                    style="font-family: Poppins;"
                                    type="password"
                                    class="form-control"
                                    placeholder="Re-enter Password"
                                    autocomplete="off"
                                    name="confirm_password"
                                    id="confirm_password">

                            </div>


                            <label>
                                Birthday
                            </label>

                            <div>

                                <input
                                    style="font-family: Poppins;"
                                    type="date"
                                    class="form-control"
                                    autocomplete="off"
                                    name="bday"
                                    id="bday">

                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================
                     SUBMIT / CANCEL
                ========================== -->

                <div class="submit">

                    <div class="sub1">

                        <button
                            type="submit"
                            class="btn1">
                            Submit
                        </button>

                    </div>

                    <div class="space1"></div>

                    <div class="sub2">

                        <a
                            class="btn2"
                            href="../interface/user_accounts.html"
                            role="button">
                            Cancel
                        </a>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           ADMIN DROPDOWN
        ========================== */

        function myFunction() {

            document
                .getElementById("myDropdown")
                .classList
                .toggle("show");

        }


        window.onclick = function(event) {

            if (!event.target.matches(".dropbtn")) {

                const dropdowns =
                    document.getElementsByClassName(
                        "dropdown-content"
                    );

                for (
                    let i = 0;
                    i < dropdowns.length;
                    i++
                ) {

                    const openDropdown =
                        dropdowns[i];

                    if (
                        openDropdown
                            .classList
                            .contains("show")
                    ) {

                        openDropdown
                            .classList
                            .remove("show");

                    }

                }

            }

        };


        /* =========================
           BACK BUTTON
        ========================== */

        function goBack() {

            window.location.href =
                "../interface/user_accounts.html";

        }


        /* =========================
           SHOW ERROR
        ========================== */

        function showError(message) {

            const error =
                document.getElementById(
                    "errorMessage"
                );

            const success =
                document.getElementById(
                    "successMessage"
                );

            success.style.display = "none";

            error.textContent = message;
            error.style.display = "block";

        }


        /* =========================
           SHOW SUCCESS
        ========================== */

        function showSuccess(message) {

            const error =
                document.getElementById(
                    "errorMessage"
                );

            const success =
                document.getElementById(
                    "successMessage"
                );

            error.style.display = "none";

            success.textContent = message;
            success.style.display = "block";

        }


        /* =========================
           FORM VALIDATION
        ========================== */

        document
            .getElementById("employeeForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const fname =
                        document
                            .getElementById("fname")
                            .value
                            .trim();

                    const lname =
                        document
                            .getElementById("lname")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const confirmPassword =
                        document
                            .getElementById(
                                "confirm_password"
                            )
                            .value;

                    const contact =
                        document
                            .getElementById("contact")
                            .value
                            .trim();

                    const birthday =
                        document
                            .getElementById("bday")
                            .value;

                    const role =
                        document
                            .getElementById("role")
                            .value;


                    /* =========================
                       REQUIRED FIELDS
                    ========================== */

                    if (
                        !fname ||
                        !lname ||
                        !email ||
                        !password ||
                        !confirmPassword ||
                        !contact ||
                        !birthday ||
                        !role
                    ) {

                        showError(
                            "All Fields Must Be Required"
                        );

                        return;

                    }


                    /* =========================
                       EMAIL VALIDATION
                    ========================== */

                    const emailPattern =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (
                        !emailPattern.test(email)
                    ) {

                        showError(
                            "Please enter a valid email address."
                        );

                        return;

                    }


                    /* =========================
                       PASSWORD LENGTH
                    ========================== */

                    if (
                        password.length < 8
                    ) {

                        showError(
                            "Password must be at least 8 characters long."
                        );

                        return;

                    }


                    /* =========================
                       PASSWORD MATCH
                    ========================== */

                    if (
                        password !== confirmPassword
                    ) {

                        showError(
                            "Passwords do not match."
                        );

                        return;

                    }


                    /* =========================
                       UPPERCASE
                    ========================== */

                    if (
                        !/[A-Z]/.test(password)
                    ) {

                        showError(
                            "Password must contain at least one uppercase letter."
                        );

                        return;

                    }


                    /* =========================
                       NUMBER
                    ========================== */

                    if (
                        !/[0-9]/.test(password)
                    ) {

                        showError(
                            "Password must contain at least one number."
                        );

                        return;

                    }


                    /* =========================
                       DEMO SUBMISSION
                    ========================== */

                    showSuccess(
                        "Client Added Successfully"
                    );


                    /*
                        Since this is now a standalone
                        HTML page, there is no database.

                        The form is only simulated.

                        Redirect after a short delay.
                    */

                    setTimeout(function() {

                        window.location.href =
                            "../interface/user_accounts.html";

                    }, 1000);

                }
            );

    </script>

</body>

</html>
