
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../media/BUBBLE.jpg">
    <link rel="stylesheet" href="../fonts/fonts.css">

    <title>Admin Interface</title>

</head>


<style>

    .left-img {
        position: relative;
        width: 45%;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
    }


    .right-button {
        position: relative;
        width: 55%;
        height: 400px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
    }


    .menu {
        position: relative;
        top: 100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 90%;
        height: 500px;
    }


    .navbar {
        background-color: #7e5832;
        width: 100%;
        height: 80px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        box-shadow: 0px 5px 11px 1px rgba(0, 0, 0, 0.28);
        display: flex;
        justify-content: left;
    }


    .navbar-right {
        width: 50%;
        height: 80px;
        position: absolute;
        top: 0;
        right: 0;
        z-index: 11;
        display: flex;
        justify-content: right;
    }


    .buttons {
        position: relative;
        width: 330px;
        left: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }


    .btn {

        font-family: Poppins;
        font-weight: bold;
        color: #f0f0f0;
        box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);

        height: 40px;
        width: 150px;
        background-color: #337609;
        border: none;
        border-radius: 25px;
        transition: 0.5s;

        cursor: pointer;
    }


    .btn:hover {
        background-color: #326810;
        transition: 0.5s;
    }


    /* Dropdown Button */

    .dropbtn {
        background-color: transparent;
        color: #f0f0f0;
        padding: 16px;
        font-size: 16px;
        min-width: 110px;
        border: none;
        cursor: pointer;

        font-family: Poppins;
        font-weight: bolder;
    }


    .dropbtn:hover {
        background-color: #5a4026;
    }


    /* Dropdown container */

    .dropdown {
        position: relative;
        width: 490px;
        display: flex;
        justify-content: right;
    }


    /* Dropdown Content */

    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f1f1f1;
        min-width: 110px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
        top: 80px;

        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
    }


    /* Links inside dropdown */

    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }


    /* Dropdown link hover */

    .dropdown-content a:hover {
        background-color: #ddd;

        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
    }


    /* Show dropdown */

    .show {
        display: block;
    }


    .pos,
    .inv {
        height: 100%;
        width: 450px;
        border: none;
        border-radius: 25px;
    }


    h4 {
        font-family: BoldFont;
        font-size: 30px;
        margin: 20px 0;
    }


    .btn1 {

        font-family: Poppins;
        font-size: 20px;
        color: #f0f0f0;
        box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);

        height: 60px;
        width: 90%;
        margin: 20px;
        background-color: #337609;
        border: none;
        border-radius: 20px;
        transition: 0.5s;

        cursor: pointer;
    }


    .btn-notif {

        position: relative;

        font-family: Poppins;
        font-size: 20px;
        color: #f0f0f0;
        box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);

        height: 60px;
        width: 90%;
        margin: 20px;
        margin-bottom: 15px;
        background-color: #337609;
        border: none;
        border-radius: 20px;
        transition: 0.5s;

        display: flex;
        justify-content: center;
        align-items: center;

        cursor: pointer;
    }


    .btn-notifa {

        position: relative;

        font-family: Poppins;
        font-size: 20px;
        color: #f0f0f0;
        box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);

        height: 60px;
        width: 90%;
        margin: 40px;
        left: -20px;
        background-color: #337609;
        border: none;
        border-radius: 20px;
        transition: 0.5s;

        display: flex;
        justify-content: center;
        align-items: center;

        cursor: pointer;
    }


    .btn1:hover,
    .btn-notif:hover,
    .btn-notifa:hover {
        background-color: #1d3c09;
        transition: 0.5s;
    }


    .notif,
    .notif2 {
        position: absolute;
        background-color: red;
        border-radius: 50px;
        color: #f0f0f0;
        padding: 0 5px;
        display: none;
        justify-content: center;
        align-items: center;

        top: -10px;
        right: -10px;

        width: auto;
        min-width: 30px;
        height: 40px;
        font-family: Poppins;
        font-size: 13px;
        font-weight: bold;
    }


    .notif-hide {
        display: none;
    }


    .footer {
        color: #181818;
        text-align: center;
        font-size: 12px;

        width: 100%;
        height: 10%;
        position: absolute;
        bottom: 100px;
        left: 0;
        z-index: 10;
    }


    .clock {
        font-size: 20px;
        color: white;
        font-weight: bold;
        font-family: Poppins;
        position: relative;
        width: auto;
        left: 37%;
        display: flex;
        align-items: center;
    }


    .flex-container {

        display: flex;

        justify-content: center;
        align-items: stretch;

        flex-direction: row;
        flex-wrap: wrap;

        height: 100%;
        padding: 15px;
        gap: 5px;
        padding-top: 10%;
    }


    .flex-container > div {
        border-radius: 5px;
        padding: 8px;
    }


    .item1 {
        order: 1;
        align-self: auto;
    }


    .item2 {
        order: 2;
    }


    .item3 {
        order: 3;
    }


    .title {
        padding: 10px;
    }


    .title h4 {
        font-size: clamp(1rem, 2vw + 0.5rem, 1.5rem);
    }


    .welcome-float {
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #1d3c09;
        color: white;
        padding: 15px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 9999;
        font-size: 16px;
        font-weight: 500;
        animation: fadeOut 5s ease-in-out forwards;
    }


    .welcome-float p {
        margin: 0;
        padding: 0;
    }


    @keyframes fadeOut {

        0% {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        85% {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        100% {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
        }

    }

</style>


<body>


    <!-- =====================================================
         WELCOME NOTIFICATION
    ====================================================== -->

    <div id="welcome-notification" class="welcome-float">

        <p>Welcome Admin</p>

    </div>



    <!-- =====================================================
         NAVIGATION BAR
    ====================================================== -->

    <div class="navbar">

        <div
            style="
                position: relative;
                width: 20px;
                left: 30px;
                display: flex;
                align-items: center;
            "
        ></div>


        <div class="buttons">

            <form action="../interface/user_accounts.html">

                <button
                    type="submit"
                    class="btn"
                >
                    User Accounts
                </button>

            </form>


            <form action="../interface/login_records.html">

                <button
                    type="submit"
                    class="btn"
                >
                    Login History
                </button>

            </form>

        </div>

    </div>



    <!-- =====================================================
         RIGHT NAVIGATION BAR
    ====================================================== -->

    <div class="navbar-right">


        <!-- CLOCK -->

        <div
            id="clock"
            class="clock"
        ></div>



        <!-- ADMIN DROPDOWN -->

        <div class="dropdown">

            <button
                onclick="myFunction()"
                class="dropbtn"
            >
                Admin
            </button>


            <div
                id="myDropdown"
                class="dropdown-content"
            >

                <a href="login.html">
                    Logout
                </a>

            </div>

        </div>


        <div
            style="
                position: relative;
                width: 20px;
                right: 30px;
                display: flex;
                align-items: center;
            "
        ></div>

    </div>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <div class="flex-container">


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="item1">

            <div class="logo">

                <img
                    src="../media/BUBBLE.jpg"
                    width="500px"
                    alt="Bubble Hideout Logo"
                >

            </div>

        </div>



        <!-- =================================================
             MENU AND ORDER MANAGEMENT
        ================================================== -->

        <div class="item2">

            <div class="pos">

                <center>

                    <div class="title">

                        <h4>
                            Menu and Order Management
                        </h4>

                    </div>


                    <form action="../pointofsale/food2.html">

                        <button
                            type="submit"
                            class="btn1"
                        >
                            Item List
                        </button>

                    </form>


                    <form action="../pointofsale/new_receipt_records.html">

                        <button
                            type="submit"
                            class="btn1"
                        >
                            Order Records
                        </button>

                    </form>


                    <form action="../pointofsale/sales.html">

                        <button
                            type="submit"
                            class="btn1"
                        >
                            Sale Records
                        </button>

                    </form>

                </center>

            </div>

        </div>



        <!-- =================================================
             INVENTORY MANAGEMENT
        ================================================== -->

        <div class="item3">

            <div class="inv">

                <center>

                    <div class="title">

                        <h4>
                            Inventory Management
                        </h4>

                    </div>


                    <form action="../inventory/inventory.html">

                        <button
                            type="submit"
                            class="btn1"
                        >
                            Inventory Summary
                        </button>

                    </form>


                    <form action="../inventory/needed_inventory.html">

                        <button
                            type="submit"
                            class="btn-notif"
                        >

                            Stocks to Order

                            <div
                                class="notif"
                                id="notif"
                            ></div>

                        </button>

                    </form>


                    <form action="../inventory/current_inventory.html">

                        <button
                            type="submit"
                            class="btn-notifa"
                        >

                            Current Stocks

                            <div
                                class="notif2"
                                id="notif2"
                            ></div>

                        </button>

                    </form>

                </center>

            </div>

        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           REMOVE WELCOME MESSAGE AFTER 5 SECONDS
        ====================================================== */

        setTimeout(function() {

            var notification =
                document.getElementById(
                    'welcome-notification'
                );


            if (notification) {

                notification.remove();

            }

        }, 5000);



        /* =====================================================
           DROPDOWN
        ====================================================== */

        function myFunction() {

            document
                .getElementById("myDropdown")
                .classList
                .toggle("show");

        }



        /* =====================================================
           CLOSE DROPDOWN WHEN CLICKING OUTSIDE
        ====================================================== */

        window.onclick = function(event) {

            if (!event.target.matches('.dropbtn')) {

                var dropdowns =
                    document.getElementsByClassName(
                        'dropdown-content'
                    );


                var i;


                for (
                    i = 0;
                    i < dropdowns.length;
                    i++
                ) {

                    var openDropdown =
                        dropdowns[i];


                    if (
                        openDropdown.classList.contains(
                            'show'
                        )
                    ) {

                        openDropdown.classList.remove(
                            'show'
                        );

                    }

                }

            }

        };



        /* =====================================================
           CLOCK
        ====================================================== */

        function updateClock() {

            const now = new Date();


            let hours =
                now.getHours();


            const minutes =
                now.getMinutes()
                .toString()
                .padStart(2, '0');


            const seconds =
                now.getSeconds()
                .toString()
                .padStart(2, '0');


            const ampm =
                hours >= 12
                    ? 'PM'
                    : 'AM';


            hours =
                hours % 12 || 12;


            document.getElementById(
                'clock'
            ).textContent =
                `${hours}:${minutes}:${seconds} ${ampm}`;

        }


        setInterval(
            updateClock,
            1000
        );


        updateClock();


    </script>


</body>

</html>
