<!DOCTYPE html>

<html lang="en">
<head>

<style>
.navbar {
    background-color: #7e5832;
    width: 100%;
    height: 80px;
    position: absolute; 
    top: 0; 
    left: 0; 
    z-index: 10;
    box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
    display: flex;
    justify-content: left;
}

.buttons {
    position: relative; 
    width: 370px;
    left: 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn {
    font-family: Poppins;
    font-weight: bold;
    color: #f0f0f0;
    box-shadow: 3px 4px 11px 1px rgba(0,0,0,0.28);

    height: 40px;
    width: 150px;
    background-color: #337609;
    border: none;
    border-radius: 25px;
    transition: 0.5s;
    cursor: pointer;
}

.btn:hover {
    background-color: #326810;
    transition: 0.5s;
}

.space {
    position: relative; 
    width: 320px;
    left: 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-right {
    width: 50%;
    height: 80px;
    position: absolute; 
    top: 0; 
    right: 0; 
    z-index: 11;
    display: flex;
    justify-content: right;
}

/* Dropdown Button */
.dropbtn {
    background-color: transparent;
    color: #f0f0f0;
    padding: 16px;
    min-width: 110px;
    font-size: 16px;
    border: none;
    cursor: pointer;

    font-family: Poppins;
    font-weight: bolder;
}

.dropbtn:hover {
    background-color: #5a4026;
}

/* Dropdown */
.dropdown {
    position: relative; 
    width: 490px;
    display: flex;
    justify-content: right;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: #f1f1f1;
    min-width: 110px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
    top: 80px;

    border-bottom-left-radius: 5px;
    border-bottom-right-radius: 5px;
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #ddd;
    
    border-bottom-left-radius: 5px;
    border-bottom-right-radius: 5px;
}

.show {
    display: block;
}

.list {
    position: relative;
    top: 100px;
}

.main {
    position: relative;
    margin: auto;
    width: 70%;
    display: flex;
    align-items: center;
}

.left {
    position: relative;
    height: auto;
    width: 50%;
    padding: 20px;
}

.left-a,
.right-a {
    position: relative;
}

.right {
    position: relative;
    height: auto;
    width: 50%;
    padding: 20px;
}

.inputs {
    padding: 10px;
}

input {
    border-color: solid #337609;
    border-radius: 10px;
    background-color: white;
    margin-bottom: 10px;
    color: #181818;
    height: 30px;
    width: 100%;
    text-indent: 10px;
    outline: none;
    box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);  
}

.submit {
    display: flex;
    width: 70%;
    margin: auto;
    justify-content: center;
}

.space1 {
    width: 20%;
}

.btn1 {
    width: 200px;
    background-color: #2c2c2c;
    box-shadow: 0px 5px 11px 1px rgba(0,0,0,0.28);
    border: none;
    height: 30px;
    margin: 10px 50px;
    border-radius: 15px;
    color: #f0f0f0;
    font-family: Poppins;
    cursor: pointer;
}

.btn1:hover {
    background-color: #444;
}
</style>

<body>

<!-- NAVBAR -->

<div class="navbar">

```

```

</div>

<!-- ADMIN DROPDOWN -->

<div class="navbar-right">

```
<div class="dropdown">

    <button
        onclick="myFunction()"

<div style="

"></div>

</div>

<!-- MAIN CONTENT -->

<div class="list">

```
<center>
    <h1>Edit Employee's Info</h1>
</center>


<div class="inputs">

    <form id="editForm">

        <div class="main">

            <!-- LEFT SIDE -->
            <div class="left">

                <div class="left-a">

                    <label>First Name</label>

                    <div style="margin-right: 5%;">

                        <input
                            style="font-family: Poppins;"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            name="fname"
                            value="Juan">

                    </div>


                    <label>Email</label>

                    <div style="margin-right: 5%;">

                        <input

                            type="email"

                            name="email"

                    </div>


                    <label>Contact Number</label>

                    <div style="margin-right: 5%;">

                        <input
                            style="font-family: Poppins;"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            name="contact"
                            value="09123456789">

                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="right">

                <div class="right-a">

                    <label>Last Name</label>

                    <div>

                        <input
                            style="font-family: Poppins;"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            name="lname"
                            value="Dela Cruz">

                    </div>


                    <label>Password</label>

                    <div class="col-sm-31">

                        <input
                            style="font-family: Poppins;"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            name="password"
                            value="password123">

                    </div>


                    <label>Birthday</label>

                    <div class="col-sm-31">

                        <input
                            style="font-family: Poppins;"
                            type="date"

                            autocomplete="off"

                    </div>

                </div>

            </div>

        </div>


        <!-- BUTTONS -->
        <div class="submit">

            <div class="sub1">

                <button
                    type="button"
                    class="btn1"
                    onclick="submitForm()">
                    Submit
                </button>

            </div>


            <div class="space1"></div>


            <div class="sub2">

                <button
                    type="button"
                    class="btn1"
                    onclick="cancelEdit()">
                    Cancel
                </button>

            </div>

        </div>

    </form>

</div>
```

</div>

<script>

/* =========================
   ADMIN DROPDOWN
========================= */

function myFunction() {

    document
        .getElementById("myDropdown")
        .classList.toggle("show");

}


/* Close dropdown when clicking elsewhere */

window.onclick = function(event) {

    if (!event.target.matches('.dropbtn')) {

        var dropdowns =
            document.getElementsByClassName("dropdown-content");

        for (
            var i = 0;
            i < dropdowns.length;
            i++
        ) {

            var openDropdown = dropdowns[i];

            if (
                openDropdown.classList.contains('show')
            ) {

                openDropdown.classList.remove('show');

            }

        }

    }

};


/* =========================
   NAVIGATION
========================= */

function goBack() {

    window.location.href = "user_accounts.html";

}


function cancelEdit() {

    window.location.href = "user_accounts.html";

}


function logout() {

    window.location.href = "login.html";

}


/* =========================
   SUBMIT
========================= */

function submitForm() {

    alert("Employee information updated successfully.");

    window.location.href = "user_accounts.html";

}

</script>
