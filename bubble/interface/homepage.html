<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../media/BUBBLE.jpg">
    <link rel="stylesheet" href="../fonts/fonts.css">

    <title>Employee Interface</title>
</head>

<style>
    .navbar {
        background-color: #7e5832;
        width: 100%;
        height: 80px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        box-shadow: 0px 5px 11px 1px rgba(0, 0, 0, 0.28);
        display: flex;
        justify-content: left;
    }

    .navbar-right {
        width: 50%;
        height: 80px;
        position: absolute;
        top: 0;
        right: 0;
        z-index: 11;
        display: flex;
        justify-content: right;
    }

    .buttons {
        position: relative;
        width: 330px;
        left: 30px;
        display: flex;
        justify-content: left;
        gap: 20px;
        align-items: center;
    }

    .btn {
        font-family: Poppins;
        font-weight: bold;
        color: #f0f0f0;
        box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);
        height: 40px;
        width: 150px;
        font-size: 0.85rem;
        background-color: #337609;
        border: none;
        border-radius: 25px;
        transition: 0.5s;
        cursor: pointer;
    }

    .btn:hover {
        background-color: #326810;
    }

    .btn-endsale {
        position: absolute;
        font-family: Poppins;
        font-weight: bold;
        color: #f0f0f0;
        box-shadow: 3px 4px 11px 1px rgba(0, 0, 0, 0.28);
        height: 40px;
        width: 150px;
        right: 20px;
        
        background-color: #337609;
        border: none;
        border-radius: 25px;
        transition: 0.5s;
        cursor: pointer;
    }

    .btn-endsale:hover {
        background-color: #326810;
    }

    .dropbtn {
        background-color: transparent;
        color: #f0f0f0;
        padding: 16px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        font-family: Poppins;
        font-weight: bolder;
    }

    .dropbtn:hover,
    .dropbtn:focus {
        background-color: #5a4026;
    }

    .dropdown {
        position: relative;
        width: 490px;
        display: flex;
        justify-content: right;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f1f1f1;
        min-width: 110px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
        top: 80px;
        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
    }

    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        font-family: Poppins;
    }

    .dropdown-content a:hover {
        background-color: #ddd;
    }

    .show {
        display: block;
    }

    .main {
        position: relative;
        width: 100%;
        min-height: 80vh;
        top: 60px;
        display: flex;
        flex-direction: column;
    }

    .sales-summary {
        position: relative;
        padding: 10px;
        display: flex;
        justify-content: left;
        align-items: center;
    }

    .sales-bottom {
        position: relative;
        height: 60vh;
        padding: 10px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
    }

    .left,
    .right {
        background-color: white;
        border: #337609 3px solid;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        border-radius: 20px;
        width: 48%;
        height: 100%;
        margin: 5px;
    }

    .scroll {
        overflow-y: auto;
        overflow-x: hidden;
        height: 70%;
    }

    th,
    td {
        padding: 10px;
    }

    table {
        position: relative;
        width: 100%;
        margin: auto;
        border-collapse: collapse;
        font-family: Poppins;
    }

    tr {
        position: relative;
        border-bottom: 1px solid #ccc;
        padding: 20px;
        margin: 5px;
    }

    th {
        text-align: left;
    }

    .btn-edit {
        text-decoration: none;
        position: relative;
        background-color: rgb(91, 149, 91);
        padding: 3px;
        border-radius: 5px;
        color: #f0f0f0;
        border-color: transparent;
        margin: 5px;
        font-family: Poppins;
        cursor: pointer;
    }

    .btn-edit:hover {
        background-color: rgb(79, 128, 79);
    }

    .btn-edita {
        text-decoration: none;
        text-align: center;
        position: relative;
        background-color: rgb(91, 149, 91);
        padding: 3px;
        border-radius: 5px;
        color: #f0f0f0;
        border-color: transparent;
        margin: 5px;
        font-family: Poppins;
        cursor: pointer;
    }

    .btn-edita:hover {
        background-color: rgb(79, 128, 79);
    }

    #right {
        text-align: right;
    }

    #chicken {
        background-color: #f29c11;
    }

    #viewRec {
        background-color: #2e9ae1;
    }

    .a {
        position: fixed;
        width: 10%;
        height: 10%;
        z-index: 15;
        left: 25%;
        top: 30%;
    }

    .dropdown-ver {
        display: none;
        position: fixed;
        background-color: #f1f1f1;
        width: 45.5%;
        padding: 30px;
        margin: auto;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 20;
        top: 200px;
        border-radius: 15px;
        font-family: Poppins;
    }

    .b {
        display: flex;
        justify-content: space-evenly;
    }

    .show1 {
        display: block;
    }

    .rem1 {
        display: none;
    }

    h1,
    h2,
    h3 {
        font-size: 80px;
        font-family: Poppins;
    }

    .clock {
        font-size: 20px;
        color: white;
        font-weight: bold;
        font-family: Poppins;
        position: relative;
        width: auto;
        left: 37%;
        display: flex;
        align-items: center;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        justify-content: center;
        align-items: center;
        z-index: 999;
    }

    .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        text-align: center;
        font-family: Poppins;
    }

    .modal-content input,
    .modal-content select {
        width: 100%;
        margin: 8px 0;
        padding: 6px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    .modal-actions button {
        margin: 5px;
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .flex-container {
        display: flex;
        justify-content: center;
        flex-direction: row;
        flex-wrap: nowrap;
        align-content: stretch;
        height: 100%;
        width: 100%;
        padding: 15px;
        gap: 10px;
        box-sizing: border-box;
    }

    .flex-container > div {
        background: white;
        border: 3px solid #326810;
        border-radius: 5px;
        padding: 8px;
    }

    .item1 {
        order: 1;
        width: 60%;
    }

    .item2 {
        order: 2;
        width: 40%;
    }

    .welcome-float {
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #1d3c09;
        color: white;
        padding: 15px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 9999;
        font-size: 16px;
        font-weight: 500;
        font-family: Poppins;
        animation: fadeOut 5s ease-in-out forwards;
    }

    .welcome-float p {
        margin: 0;
        padding: 0;
    }

    @keyframes fadeOut {
        0% {
            opacity: 1;
        }

        70% {
            opacity: 1;
        }

        100% {
            opacity: 0;
            visibility: hidden;
        }
    }

    .status-ready {
        color: #337609;
        font-weight: bold;
    }

    .status-pending {
        color: #f29c11;
        font-weight: bold;
    }

    @media (max-width: 768px) {

        .flex-container {
            flex-direction: column;
            flex-wrap: wrap;
        }

        .item1,
        .item2 {
            width: 94%;
        }

        .main {
            height: auto;
            top: 50px;
            padding: 10px;
            gap: 5px;
        }

        .flex-container > div {
            padding: 6px;
            border-width: 2px;
        }

        .btn {
            width: 100px;
            height: 30px;
            font-size: 10px;
            border-radius: 18px;
        }

        .clock {
            display: none;
        }

        .buttons {
            gap: 5px;
            left: 10px;
        }

        .logo img {
            width: 60px;
        }

        .navbar {
            height: 70px;
        }

        .navbar-right {
            height: 70px;
        }

        .dropdown-content {
            top: 70px;
        }

        .sales-summary {
            flex-direction: column;
            align-items: flex-start;
        }

        .sales-summary h1 {
            font-size: 30px !important;
        }

        .btn-endsale {
            position: relative;
            right: auto;
            bottom: auto;
            margin: 10px;
        }

        .dropdown-ver {
            width: 70%;
            left: 10%;
        }
    }
</style>

<body>

    <!-- Welcome Notification -->
    <div id="welcome-notification" class="welcome-float">
        <p>Welcome Employee</p>
    </div>


    <!-- Complete Order Confirmation -->
    <div class="a">
        <div class="dropdown-ver" id="del-drop">

            <div class="body">
                <p>Order Completion</p>

                <p>Are you sure the ORDER is finished?</p>

                <input type="hidden" id="complete_order_id">

            </div>

            <div class="b">

                <button
                    type="button"
                    style="display:inline-block; width:100px; height:30px; align-items:center;"
                    class="btn-edit"
                    onclick="closeCompleteModal()">
                    No, Not Yet
                </button>

                <button
                    type="button"
                    style="display:inline-block; width:100px; height:30px; align-items:center;"
                    class="btn-edit"
                    onclick="completeOrder()">
                    Yes, It's Finished
                </button>

            </div>

        </div>
    </div>


    <!-- Add Chicken Modal -->
    <div id="chickenModal" class="modal">

        <div class="modal-content">

            <form id="chickenForm">

                <label>Add Chicken</label>

                <input type="hidden" id="order_id">

                <label>Quantity (3–5):</label>

                <input
                    type="number"
                    id="quantity"
                    min="3"
                    max="5"
                    required
                    style="font-family:Poppins; width:96%;">

                <label>Flavor:</label>

                <select
                    id="flavor"
                    required
                    style="font-family:Poppins;">

                    <option value="" disabled selected>
                        Select Flavor
                    </option>

                    <option value="Garlic Parmesan">
                        Garlic Parmesan
                    </option>

                    <option value="Buffalo">
                        Buffalo
                    </option>

                    <option value="Honey BBQ">
                        Honey BBQ
                    </option>

                    <option value="Korean Soy">
                        Korean Soy
                    </option>

                </select>

                <div class="modal-actions">

                    <button
                        type="submit"
                        class="btn-edit">
                        Add
                    </button>

                    <button
                        type="button"
                        onclick="closeModal()"
                        class="btn-edit">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">

        <div class="modal-content">

            <form id="paymentForm">

                <input type="hidden" id="pay_order_id">

                <label>Enter Payment Amount</label>

                <input
                    type="number"
                    id="amount_paid"
                    min="0"
                    step="0.01"
                    required
                    style="font-family:Poppins; width:96%;">

                <div class="modal-actions">

                    <button
                        type="submit"
                        class="btn-edit">
                        Confirm
                    </button>

                    <button
                        type="button"
                        onclick="closePayModal()"
                        class="btn-edit">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- NAVBAR -->
    <div class="navbar">

        <div style="
            position: relative;
            width: 20px;
            left: 30px;
            display: flex;
            align-items: center;">
        </div>

        <div class="logo">
            <img src="../media/BUBBLE.jpg" width="80px">
        </div>

        <div class="buttons">

            <button
                class="btn"
                onclick="location.href='../pointofsale/indeck.html'">
                Point of Sale
            </button>

            <button
                class="btn"
                onclick="location.href='../pointofsale/order_screen.html'">
                Incoming Orders
            </button>

        </div>

    </div>


    <!-- RIGHT NAVBAR -->
    <div class="navbar-right">

        <div id="clock" class="clock"></div>

        <div class="dropdown">

            <button
                onclick="myFunction()"
                class="dropbtn">
                Employee
            </button>

            <div id="myDropdown" class="dropdown-content">

                <a href="../interface/login.html">
                    Logout
                </a>

            </div>

        </div>

        <div style="
            position: relative;
            width: 20px;
            right: 30px;
            display: flex;
            align-items: center;">
        </div>

    </div>


    <!-- MAIN -->
    <div class="main">

        <!-- SALES SUMMARY -->
        <div class="sales-summary">

            <h1
                id="totalSale"
                style="font-size:60px;">
                Total Sale: Php 0.00
            </h1>

            <button
                class="btn-endsale"
                onclick="endSale()">
                End Sale
            </button>

        </div>


        <!-- SALES CONTENT -->
        <div class="sales-bottom">

            <div class="flex-container">


                <!-- ORDER STATUS -->
                <div class="item1">

                    <center>

                        <h1
                            style="font-size:30px; margin:20px;">
                            Order Status
                        </h1>

                    </center>

                    <div class="scroll">

                        <table class="table table-bordered table-striped">

                            <thead>

                                <tr>

                                    <th>
                                        <center>
                                            Order ID
                                        </center>
                                    </th>

                                    <th>
                                        Total
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        <center>
                                            Options
                                        </center>
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="ordersTable">

                            </tbody>

                        </table>

                    </div>

                </div>


                <!-- LIMITED ITEMS -->
                <div class="item2">

                    <center>

                        <h1
                            style="font-size:30px; margin:20px;">
                            Limited Items
                        </h1>

                    </center>

                    <div class="scroll">

                        <table class="table table-bordered table-striped">

                            <thead>

                                <tr>

                                    <th>
                                        Product ID
                                    </th>

                                    <th>
                                        Product Name
                                    </th>

                                    <th>
                                        Quantity
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="limitedItemsTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>


<script>

    /*
    =====================================================
    DEMO DATA
    =====================================================
    */

    let totalSale = 12580.50;


    /*
    Order data

    Order types:
    ORD = Standard POS
    TBL = QR/table order

    menuItem:
    UNLICHICKENWINGS = Unlimited Chicken
    OTHER = Normal order
    */

    let orders = [

        {
            orderId: "ORD-1001",
            total: 450.00,
            status: "Order Ready",
            type: "POS",
            menuItem: "UNLICHICKENWINGS",
            amountPaid: 450.00
        },

        {
            orderId: "ORD-1002",
            total: 320.00,
            status: "Pending",
            type: "POS",
            menuItem: "OTHER",
            amountPaid: 320.00
        },

        {
            orderId: "TBL-001",
            total: 580.00,
            status: "Order Ready",
            type: "QR",
            menuItem: "OTHER",
            amountPaid: 580.00
        },

        {
            orderId: "TBL-002",
            total: 750.00,
            status: "Pending",
            type: "QR",
            menuItem: "UNLICHICKENWINGS",
            amountPaid: 0.00
        },

        {
            orderId: "TBL-003",
            total: 420.00,
            status: "Order Ready",
            type: "QR",
            menuItem: "UNLICHICKENWINGS",
            amountPaid: 420.00
        },

        {
            orderId: "ORD-1003",
            total: 290.00,
            status: "Order Ready",
            type: "POS",
            menuItem: "OTHER",
            amountPaid: 290.00
        },

        {
            orderId: "TBL-004",
            total: 630.00,
            status: "Pending",
            type: "QR",
            menuItem: "OTHER",
            amountPaid: 0.00
        }

    ];


    /*
    Limited inventory
    */

    let inventory = [

        {
            id: "INV-001",
            name: "Chicken Wings",
            category: "Meat",
            quantity: 8
        },

        {
            id: "INV-002",
            name: "Whole Milk",
            category: "Dairy",
            quantity: 7
        },

        {
            id: "INV-003",
            name: "Strawberry Syrup",
            category: "Syrup",
            quantity: 5
        },

        {
            id: "INV-004",
            name: "Tapioca Pearls",
            category: "Ingredients",
            quantity: 10
        },

        {
            id: "INV-005",
            name: "Coffee Beans",
            category: "Coffee",
            quantity: 4
        },

        {
            id: "INV-006",
            name: "Sugar",
            category: "Ingredients",
            quantity: 18
        },

        {
            id: "INV-007",
            name: "Cocoa Powder",
            category: "Ingredients",
            quantity: 6
        }

    ];


    /*
    =====================================================
    DISPLAY TOTAL SALE
    =====================================================
    */

    function updateTotalSale() {

        document.getElementById("totalSale").textContent =
            "Total Sale: Php " +
            totalSale.toLocaleString("en-PH", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

    }


    /*
    =====================================================
    DISPLAY ORDERS
    =====================================================
    */

    function renderOrders() {

        const table =
            document.getElementById("ordersTable");

        table.innerHTML = "";

        orders.forEach(order => {

            let options = "";


            /*
            ============================================
            STANDARD POS ORDER
            ============================================
            */

            if (order.type === "POS") {

                if (order.status === "Order Ready") {

                    options += `
                        <button
                            class="btn-edita"
                            style="
                                display:inline-block;
                                width:60px;
                                height:30px;
                                font-size:10px;"
                            data-id="${order.orderId}"
                            onclick="confirmDel(this)">
                            Complete Order
                        </button>
                    `;

                }

                options += `
                    <a
                        class="btn-edita"
                        style="
                            display:inline-block;
                            width:60px;
                            height:30px;
                            font-size:10px;"
                        href="../pointofsale/view_receipt_home.html?order_id=${order.orderId}"
                        id="viewRec">
                        View Receipt
                    </a>
                `;

            }


            /*
            ============================================
            QR ORDER
            ============================================
            */

            else if (order.type === "QR") {

                /*
                Unlimited Chicken
                */

                if (order.menuItem === "UNLICHICKENWINGS") {

                    /*
                    Ready + Paid
                    */

                    if (
                        order.status === "Order Ready" &&
                        order.amountPaid !== 0
                    ) {

                        options += `
                            <button
                                class="btn-edita"
                                style="
                                    display:inline-block;
                                    width:60px;
                                    height:30px;
                                    font-size:10px;"
                                data-id="${order.orderId}"
                                onclick="confirmDel(this)">
                                Complete Order
                            </button>
                        `;

                    }

                    /*
                    Not paid / pending
                    */

                    else {

                        options += `
                            <button
                                class="btn-edita"
                                style="
                                    display:inline-block;
                                    width:60px;
                                    height:30px;
                                    font-size:10px;"
                                data-id="${order.orderId}"
                                onclick="confirmPay(this)">
                                Complete Payment
                            </button>
                        `;

                    }


                    /*
                    Add chicken
                    */

                    options += `
                        <button
                            class="btn-edita"
                            style="
                                display:inline-block;
                                width:60px;
                                height:30px;
                                font-size:10px;"
                            data-id="${order.orderId}"
                            onclick="openModal(this)"
                            id="chicken">
                            Add Chicken
                        </button>
                    `;

                }


                /*
                ========================================
                NORMAL QR ORDER
                ========================================
                */

                else {

                    if (
                        order.status === "Order Ready" &&
                        order.amountPaid !== 0
                    ) {

                        options += `
                            <button
                                class="btn-edita"
                                style="
                                    display:inline-block;
                                    width:60px;
                                    height:30px;
                                    font-size:10px;"
                                data-id="${order.orderId}"
                                onclick="confirmDel(this)">
                                Complete Order
                            </button>
                        `;

                    }

                    else {

                        options += `
                            <button
                                class="btn-edita"
                                style="
                                    display:inline-block;
                                    width:60px;
                                    height:30px;
                                    font-size:10px;"
                                data-id="${order.orderId}"
                                onclick="confirmPay(this)">
                                Complete Payment
                            </button>
                        `;

                    }

                }


                /*
                View receipt
                */

                options += `
                    <a
                        class="btn-edita"
                        style="
                            display:inline-block;
                            width:60px;
                            height:30px;
                            font-size:10px;"
                        href="../pointofsale/view_receipt_home.html?order_id=${order.orderId}"
                        id="viewRec">
                        View Receipt
                    </a>
                `;

            }


            /*
            ============================================
            CREATE ROW
            ============================================
            */

            const statusClass =
                order.status === "Order Ready"
                    ? "status-ready"
                    : "status-pending";


            const row = document.createElement("tr");

            row.innerHTML = `

                <td>
                    <center>
                        ${order.orderId}
                    </center>
                </td>

                <td>
                    Php ${Number(order.total).toLocaleString(
                        "en-PH",
                        {
                            minimumFractionDigits: 2
                        }
                    )}
                </td>

                <td class="${statusClass}">
                    ${order.status}
                </td>

                <td id="right">
                    ${options}
                </td>

            `;

            table.appendChild(row);

        });

    }


    /*
    =====================================================
    DISPLAY LIMITED ITEMS
    =====================================================
    */

    function renderLimitedItems() {

        const table =
            document.getElementById("limitedItemsTable");

        table.innerHTML = "";


        inventory
            .filter(item => item.quantity < 11)
            .forEach(item => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `

                    <td>
                        ${item.id}
                    </td>

                    <td>
                        ${item.name}
                    </td>

                    <td>
                        ${item.quantity}
                    </td>

                `;

                table.appendChild(row);

            });

    }


    /*
    =====================================================
    DROPDOWN
    =====================================================
    */

    function myFunction() {

        document
            .getElementById("myDropdown")
            .classList
            .toggle("show");

    }


    window.onclick = function(event) {

        if (!event.target.matches(".dropbtn")) {

            const dropdowns =
                document.getElementsByClassName(
                    "dropdown-content"
                );

            for (
                let i = 0;
                i < dropdowns.length;
                i++
            ) {

                const openDropdown =
                    dropdowns[i];

                if (
                    openDropdown
                        .classList
                        .contains("show")
                ) {

                    openDropdown
                        .classList
                        .remove("show");

                }

            }

        }

    };


    /*
    =====================================================
    COMPLETE ORDER MODAL
    =====================================================
    */

    function confirmDel(element) {

        const orderId =
            element.getAttribute("data-id");

        document
            .getElementById("complete_order_id")
            .value = orderId;

        document
            .getElementById("del-drop")
            .classList
            .add("show1");

    }


    function closeCompleteModal() {

        document
            .getElementById("del-drop")
            .classList
            .remove("show1");

    }


    function completeOrder() {

        const orderId =
            document
                .getElementById("complete_order_id")
                .value;

        const order =
            orders.find(
                item => item.orderId === orderId
            );

        if (!order) {
            return;
        }


        order.status = "Completed";


        /*
        Add order total to sales
        */

        totalSale += Number(order.total);


        updateTotalSale();
        renderOrders();

        closeCompleteModal();


        alert(
            "Order " +
            orderId +
            " has been completed!"
        );

    }


    /*
    =====================================================
    ADD CHICKEN
    =====================================================
    */

    function openModal(element) {

        const orderId =
            element.getAttribute("data-id");

        document
            .getElementById("order_id")
            .value = orderId;

        document
            .getElementById("chickenModal")
            .style.display = "flex";

    }


    function closeModal() {

        document
            .getElementById("chickenModal")
            .style.display = "none";

        document
            .getElementById("chickenForm")
            .reset();

    }


    document
        .getElementById("chickenForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const orderId =
                    document
                        .getElementById("order_id")
                        .value;

                const quantity =
                    Number(
                        document
                            .getElementById("quantity")
                            .value
                    );

                const flavor =
                    document
                        .getElementById("flavor")
                        .value;


                if (
                    quantity < 3 ||
                    quantity > 5
                ) {

                    alert(
                        "Please enter a quantity between 3 and 5."
                    );

                    return;

                }


                if (flavor === "") {

                    alert(
                        "Please select a flavor."
                    );

                    return;

                }


                /*
                Demo inventory deduction
                */

                const chicken =
                    inventory.find(
                        item =>
                            item.name ===
                            "Chicken Wings"
                    );


                if (
                    chicken &&
                    chicken.quantity < quantity
                ) {

                    alert(
                        "Not enough Chicken Wings in inventory."
                    );

                    return;

                }


                if (chicken) {
                    chicken.quantity -= quantity;
                }


                /*
                Demo order update
                */

                const order =
                    orders.find(
                        item =>
                            item.orderId ===
                            orderId
                    );


                if (order) {

                    /*
                    Demo price:
                    Php 100 per chicken
                    */

                    const additionalPrice =
                        quantity * 100;

                    order.total +=
                        additionalPrice;

                    /*
                    Only update total sales
                    if order has already been paid.
                    */

                    if (order.amountPaid > 0) {

                        totalSale +=
                            additionalPrice;

                    }

                }


                renderOrders();
                renderLimitedItems();
                updateTotalSale();

                closeModal();


                alert(
                    quantity +
                    " Chicken Wings (" +
                    flavor +
                    ") added successfully!"
                );

            }
        );


    /*
    =====================================================
    PAYMENT
    =====================================================
    */

    function confirmPay(element) {

        const orderId =
            element.getAttribute("data-id");

        document
            .getElementById("pay_order_id")
            .value = orderId;

        document
            .getElementById("paymentModal")
            .style.display = "flex";

    }


    function closePayModal() {

        document
            .getElementById("paymentModal")
            .style.display = "none";

        document
            .getElementById("paymentForm")
            .reset();

    }


    document
        .getElementById("paymentForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const orderId =
                    document
                        .getElementById("pay_order_id")
                        .value;

                const amount =
                    Number(
                        document
                            .getElementById("amount_paid")
                            .value
                    );


                const order =
                    orders.find(
                        item =>
                            item.orderId ===
                            orderId
                    );


                if (!order) {
                    return;
                }


                if (amount <= 0) {

                    alert(
                        "Please enter a valid payment amount."
                    );

                    return;

                }


                order.amountPaid =
                    amount;


                /*
                Payment is now recorded.
                */

                renderOrders();

                closePayModal();


                alert(
                    "Payment recorded successfully!"
                );

            }
        );


    /*
    =====================================================
    END SALE
    =====================================================
    */

    function endSale() {

        const confirmation =
            confirm(
                "Are you sure you want to end the current sale?"
            );


        if (!confirmation) {
            return;
        }


        alert(
            "Sale ended successfully!"
        );

    }


    /*
    =====================================================
    CLOCK
    =====================================================
    */

    function updateClock() {

        const now = new Date();

        let hours =
            now.getHours();

        const minutes =
            now.getMinutes()
                .toString()
                .padStart(2, "0");

        const seconds =
            now.getSeconds()
                .toString()
                .padStart(2, "0");

        const ampm =
            hours >= 12
                ? "PM"
                : "AM";

        hours =
            hours % 12 || 12;


        document
            .getElementById("clock")
            .textContent =
            `${hours}:${minutes}:${seconds} ${ampm}`;

    }


    setInterval(
        updateClock,
        1000
    );

    updateClock();


    /*
    =====================================================
    WELCOME NOTIFICATION
    =====================================================
    */

    setTimeout(
        function() {

            const notification =
                document.getElementById(
                    "welcome-notification"
                );

            if (notification) {
                notification.remove();
            }

        },
        5000
    );


    /*
    =====================================================
    INITIALIZE PAGE
    =====================================================
    */

    updateTotalSale();
    renderOrders();
    renderLimitedItems();

</script>
